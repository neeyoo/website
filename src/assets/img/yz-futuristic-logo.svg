<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="roboticsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA367C" />
      <stop offset="100%" stop-color="#4A2FBD" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA367C" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4A2FBD" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with tech pattern -->
  <rect width="200" height="200" fill="#121212" />
  
  <!-- Tech grid pattern -->
  <g opacity="0.15">
    <path d="M0 20 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 40 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 60 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 80 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 100 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 120 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 140 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 160 H200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M0 180 H200" stroke="#4A2FBD" stroke-width="0.5" />
    
    <path d="M20 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M40 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M60 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M80 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M100 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M120 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M140 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M160 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M180 0 V200" stroke="#4A2FBD" stroke-width="0.5" />
  </g>
  
  <!-- Main hexagonal frame -->
  <path d="M100 30 L160 60 L160 140 L100 170 L40 140 L40 60 Z" fill="none" stroke="url(#roboticsGradient)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Inner hexagonal frame -->
  <path d="M100 50 L140 70 L140 130 L100 150 L60 130 L60 70 Z" fill="none" stroke="url(#roboticsGradient)" stroke-width="1.5" />
  
  <!-- Central robotic eye/lens -->
  <circle cx="100" cy="100" r="30" fill="#121212" stroke="url(#roboticsGradient)" stroke-width="2" />
  <circle cx="100" cy="100" r="25" fill="none" stroke="url(#roboticsGradient)" stroke-width="1" />
  <circle cx="100" cy="100" r="20" fill="none" stroke="url(#roboticsGradient)" stroke-width="0.5" />
  <circle cx="100" cy="100" r="15" fill="none" stroke="url(#roboticsGradient)" stroke-width="0.5" />
  <circle cx="100" cy="100" r="10" fill="url(#glowGradient)" filter="url(#innerGlow)" />
  
  <!-- Robotic arm elements -->
  <g filter="url(#innerGlow)">
    <path d="M100 100 L130 130" stroke="white" stroke-width="2" stroke-linecap="round" />
    <path d="M100 100 L70 130" stroke="white" stroke-width="2" stroke-linecap="round" />
    <path d="M100 100 L100 70" stroke="white" stroke-width="2" stroke-linecap="round" />
    
    <!-- Joints -->
    <circle cx="100" cy="70" r="5" fill="#121212" stroke="white" stroke-width="1.5" />
    <circle cx="70" cy="130" r="5" fill="#121212" stroke="white" stroke-width="1.5" />
    <circle cx="130" cy="130" r="5" fill="#121212" stroke="white" stroke-width="1.5" />
    
    <!-- Joint details -->
    <circle cx="100" cy="70" r="2" fill="url(#roboticsGradient)" />
    <circle cx="70" cy="130" r="2" fill="url(#roboticsGradient)" />
    <circle cx="130" cy="130" r="2" fill="url(#roboticsGradient)" />
  </g>
  
  <!-- Connection lines -->
  <g stroke="url(#roboticsGradient)" stroke-width="1" stroke-dasharray="4,2" opacity="0.7">
    <path d="M40 60 L60 70" />
    <path d="M40 140 L60 130" />
    <path d="M160 60 L140 70" />
    <path d="M160 140 L140 130" />
  </g>
  
  <!-- Tech details -->
  <g opacity="0.8">
    <rect x="45" y="90" width="10" height="2" fill="white" />
    <rect x="45" y="95" width="10" height="2" fill="white" />
    <rect x="45" y="100" width="10" height="2" fill="white" />
    <rect x="45" y="105" width="10" height="2" fill="white" />
    
    <rect x="145" y="90" width="10" height="2" fill="white" />
    <rect x="145" y="95" width="10" height="2" fill="white" />
    <rect x="145" y="100" width="10" height="2" fill="white" />
    <rect x="145" y="105" width="10" height="2" fill="white" />
  </g>
  
  <!-- YZ Stylized text -->
  <g transform="translate(70, 150)">
    <!-- Y -->
    <path d="M0 -30 L15 -10 L30 -30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M15 -10 L15 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Z -->
    <path d="M40 -30 L70 -30 L40 10 L70 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Binary code decoration -->
  <g fill="white" opacity="0.4" font-family="monospace" font-size="6">
    <text x="20" y="30">01011001 01011010</text>
    <text x="20" y="180">01010010 01000101</text>
  </g>
</svg>
