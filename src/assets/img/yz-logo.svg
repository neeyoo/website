<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="roboticsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA367C" />
      <stop offset="100%" stop-color="#4A2FBD" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
  </defs>
  
  <!-- Circular background -->
  <circle cx="100" cy="100" r="90" fill="url(#roboticsGradient)" opacity="0.9" />
  <circle cx="100" cy="100" r="85" stroke="white" stroke-width="2" fill="none" opacity="0.5" />
  
  <!-- Robotic arm elements -->
  <path d="M70 130 L100 100 L130 130" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M100 100 L100 60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="100" cy="100" r="10" fill="white" />
  <circle cx="100" cy="60" r="6" fill="white" />
  <circle cx="70" cy="130" r="6" fill="white" />
  <circle cx="130" cy="130" r="6" fill="white" />
  
  <!-- Circuit board pattern -->
  <path d="M40 90 L60 90" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M140 90 L160 90" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M40 110 L60 110" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M140 110 L160 110" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M90 40 L90 60" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M110 40 L110 60" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M90 140 L90 160" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M110 140 L110 160" stroke="white" stroke-width="2" fill="none" opacity="0.7" />
  
  <!-- Initials -->
  <text x="70" y="170" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="url(#textGradient)">YZ</text>
</svg>
