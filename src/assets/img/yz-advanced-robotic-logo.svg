<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="roboticsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA367C" />
      <stop offset="100%" stop-color="#4A2FBD" />
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C0C0C0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="90" />
    </clipPath>
  </defs>
  
  <!-- Background with circuit pattern -->
  <circle cx="100" cy="100" r="90" fill="#121212" />
  
  <!-- Circuit board patterns -->
  <g opacity="0.3">
    <path d="M20 100 H180" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M100 20 V180" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M30 30 L170 170" stroke="#4A2FBD" stroke-width="0.5" />
    <path d="M30 170 L170 30" stroke="#4A2FBD" stroke-width="0.5" />
    
    <!-- Circuit nodes -->
    <circle cx="100" cy="100" r="3" fill="#AA367C" />
    <circle cx="60" cy="60" r="2" fill="#AA367C" />
    <circle cx="140" cy="60" r="2" fill="#AA367C" />
    <circle cx="60" cy="140" r="2" fill="#AA367C" />
    <circle cx="140" cy="140" r="2" fill="#AA367C" />
    
    <!-- Circuit traces -->
    <path d="M40 100 H80" stroke="#AA367C" stroke-width="1" />
    <path d="M120 100 H160" stroke="#AA367C" stroke-width="1" />
    <path d="M100 40 V80" stroke="#AA367C" stroke-width="1" />
    <path d="M100 120 V160" stroke="#AA367C" stroke-width="1" />
  </g>
  
  <!-- Main gear -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#roboticsGradient)" stroke-width="2" />
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#roboticsGradient)" stroke-width="1" />
  
  <!-- Gear teeth -->
  <g stroke="url(#roboticsGradient)" stroke-width="3" stroke-linecap="round">
    <path d="M100 30 L100 40" />
    <path d="M135 38 L130 47" />
    <path d="M162 65 L153 70" />
    <path d="M170 100 L160 100" />
    <path d="M162 135 L153 130" />
    <path d="M135 162 L130 153" />
    <path d="M100 170 L100 160" />
    <path d="M65 162 L70 153" />
    <path d="M38 135 L47 130" />
    <path d="M30 100 L40 100" />
    <path d="M38 65 L47 70" />
    <path d="M65 38 L70 47" />
  </g>
  
  <!-- Inner mechanical elements -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="white" stroke-width="1.5" opacity="0.7" />
  <circle cx="100" cy="100" r="30" fill="none" stroke="white" stroke-width="1" opacity="0.5" />
  
  <!-- Robotic arm mechanism -->
  <g filter="url(#glow)">
    <!-- Central hub -->
    <circle cx="100" cy="100" r="15" fill="#121212" stroke="url(#metalGradient)" stroke-width="2" />
    
    <!-- Arm segments -->
    <path d="M100 100 L130 130" stroke="url(#metalGradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M100 100 L70 130" stroke="url(#metalGradient)" stroke-width="4" stroke-linecap="round" />
    <path d="M100 100 L100 70" stroke="url(#metalGradient)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Joints -->
    <circle cx="100" cy="70" r="6" fill="#121212" stroke="url(#metalGradient)" stroke-width="2" />
    <circle cx="70" cy="130" r="6" fill="#121212" stroke="url(#metalGradient)" stroke-width="2" />
    <circle cx="130" cy="130" r="6" fill="#121212" stroke="url(#metalGradient)" stroke-width="2" />
    
    <!-- Joint details -->
    <circle cx="100" cy="70" r="2" fill="url(#roboticsGradient)" />
    <circle cx="70" cy="130" r="2" fill="url(#roboticsGradient)" />
    <circle cx="130" cy="130" r="2" fill="url(#roboticsGradient)" />
    <circle cx="100" cy="100" r="3" fill="url(#roboticsGradient)" />
  </g>
  
  <!-- Stylized YZ initials -->
  <g transform="translate(70, 140)">
    <!-- Y -->
    <path d="M0 -30 L10 -15 L20 -30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 -15 L10 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" />
    
    <!-- Z -->
    <path d="M30 -30 L50 -30 L30 0 L50 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Digital elements -->
  <g opacity="0.8">
    <rect x="85" y="170" width="30" height="2" fill="white" />
    <rect x="90" y="174" width="20" height="2" fill="white" />
    <rect x="95" y="178" width="10" height="2" fill="white" />
  </g>
  
  <!-- Decorative binary code -->
  <g fill="white" opacity="0.4" font-family="monospace" font-size="4">
    <text x="20" y="30">01011001</text>
    <text x="20" y="36">01011010</text>
    <text x="150" y="30">01010010</text>
    <text x="150" y="36">01000101</text>
  </g>
</svg>
